<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Cercle de protection externe -->
  <circle cx="100" cy="100" r="95" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6"/>
  
  <!-- Cercle de protection interne -->
  <circle cx="100" cy="100" r="82" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
  
  <!-- Fond circulaire gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1A8A63"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5E17A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2ECC8A"/>
      <stop offset="100%" stop-color="#0F6A4B"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="80" fill="url(#bgGrad)"/>
  
  <!-- Symbole solaire africain (Adinkra - Nyame Nti) -->
  <!-- Rayons solaires -->
  <g transform="translate(100,52)" opacity="0.9">
    <!-- Cercle solaire -->
    <circle cx="0" cy="0" r="14" fill="url(#sunGrad)" filter="url(#glow)"/>
    <!-- Centre solaire -->
    <circle cx="0" cy="0" r="6" fill="#0F172A"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
    
    <!-- Rayons -->
    <g stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-18" x2="0" y2="-22"/>
      <line x1="18" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="18" x2="0" y2="22"/>
      <line x1="-18" y1="0" x2="-22" y2="0"/>
      <line x1="12.7" y1="-12.7" x2="15.5" y2="-15.5"/>
      <line x1="12.7" y1="12.7" x2="15.5" y2="15.5"/>
      <line x1="-12.7" y1="12.7" x2="-15.5" y2="15.5"/>
      <line x1="-12.7" y1="-12.7" x2="-15.5" y2="-15.5"/>
    </g>
  </g>
  
  <!-- Silhouette humaine stylisée -->
  <!-- Tête -->
  <circle cx="100" cy="95" r="10" fill="#D4AF37" opacity="0.95"/>
  
  <!-- Corps -->
  <path d="M100 105 L100 138" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Bras en croix / ouverture -->
  <path d="M80 115 Q90 112 100 115 Q110 112 120 115" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  
  <!-- Jambes -->
  <path d="M100 138 L90 155 M100 138 L110 155" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Feuille médicinale gauche -->
  <path d="M70 120 Q45 95 55 70 Q68 90 75 105 Q80 115 70 120Z" fill="url(#leafGrad)" opacity="0.92"/>
  <!-- Nervure feuille gauche -->
  <path d="M70 120 Q60 98 57 73" stroke="#0F6A4B" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M65 110 Q58 102 57 90 M67 115 Q62 108 61 98" stroke="#2ECC8A" stroke-width="0.7" fill="none" opacity="0.5"/>
  
  <!-- Feuille médicinale droite -->
  <path d="M130 120 Q155 95 145 70 Q132 90 125 105 Q120 115 130 120Z" fill="url(#leafGrad)" opacity="0.92"/>
  <!-- Nervure feuille droite -->
  <path d="M130 120 Q140 98 143 73" stroke="#0F6A4B" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M135 110 Q142 102 143 90 M133 115 Q138 108 139 98" stroke="#2ECC8A" stroke-width="0.7" fill="none" opacity="0.5"/>
  
  <!-- Ornements africains latéraux -->
  <g opacity="0.5" stroke="#D4AF37" stroke-width="0.8" fill="none">
    <!-- Losange gauche -->
    <polygon points="62,140 56,148 62,156 68,148" />
    <!-- Losange droit -->
    <polygon points="138,140 132,148 138,156 144,148" />
  </g>
  
  <!-- Bande panafricaine bas -->
  <clipPath id="circleClip">
    <circle cx="100" cy="100" r="80"/>
  </clipPath>
  <g clip-path="url(#circleClip)">
    <rect x="20" y="168" width="53" height="5" fill="#CC0000" opacity="0.8"/>
    <rect x="73" y="168" width="54" height="5" fill="#FFD700" opacity="0.8"/>
    <rect x="127" y="168" width="53" height="5" fill="#009A00" opacity="0.8"/>
  </g>
  
  <!-- Étoile centrale -->
  <path d="M100 88 L102 93 L107 93 L103 96 L105 101 L100 98 L95 101 L97 96 L93 93 L98 93Z"
        fill="#D4AF37" opacity="0.0"/>
</svg>
