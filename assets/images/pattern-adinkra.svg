<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Symbole Adinkra - Gye Nyame (puissance divine) simplifié -->
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
    <!-- Losange central -->
    <polygon points="50,15 70,50 50,85 30,50" fill="none"/>
    <!-- Croix intérieure -->
    <line x1="50" y1="15" x2="50" y2="85"/>
    <line x1="30" y1="50" x2="70" y2="50"/>
    <!-- Cercles aux coins -->
    <circle cx="50" cy="15" r="4" fill="none"/>
    <circle cx="70" cy="50" r="4" fill="none"/>
    <circle cx="50" cy="85" r="4" fill="none"/>
    <circle cx="30" cy="50" r="4" fill="none"/>
    <!-- Points cardinaux -->
    <circle cx="50" cy="50" r="6" fill="none"/>
    <circle cx="50" cy="50" r="2" fill="currentColor" opacity="0.5"/>
  </g>
</svg>
